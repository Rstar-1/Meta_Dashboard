
name: Deploy React App to AWS EC2

on:
  push:
    branches:
      - feature/practice

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-ec2-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vite application
      - name: Build React application
        run: npm run build

      # 5. Prepare EC2 deployment directory
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/Meta_Dashboard/dist
            sudo chown -R $USER:$USER /var/www/Meta_Dashboard

      # 6. Copy Vite dist contents to EC2
      - name: Copy React build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/Meta_Dashboard/dist/"
          strip_components: 1
          overwrite: true

      # 7. Verify deployment and reload Nginx
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            test -f /var/www/Meta_Dashboard/dist/index.html
            sudo nginx -t
            sudo systemctl reload nginx
            echo "React deployment completed successfully"
